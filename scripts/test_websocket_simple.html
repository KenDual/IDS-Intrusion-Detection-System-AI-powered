<!DOCTYPE html>
<html>
<head>
    <title>IDS WebSocket Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #4ec9b0;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .connected {
            background: #0e7a0d;
        }
        .disconnected {
            background: #a1260d;
        }
        .alert {
            background: #2d2d2d;
            border-left: 4px solid #f48771;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .alert-critical {
            border-left-color: #f44336;
        }
        .alert-low {
            border-left-color: #ff9800;
        }
        button {
            background: #0e7a0d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #0c6b0b;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .stat-box {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 5px;
            flex: 1;
        }
        .stat-value {
            font-size: 32px;
            color: #4ec9b0;
        }
        #alerts {
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 IDS WebSocket Alert Monitor</h1>

        <div id="status" class="status disconnected">
            ⚠️ Disconnected
        </div>

        <div>
            <button id="connectBtn" onclick="connect()">Connect</button>
            <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
            <button onclick="clearAlerts()">Clear Alerts</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div>Total Alerts</div>
                <div class="stat-value" id="totalAlerts">0</div>
            </div>
            <div class="stat-box">
                <div>Critical</div>
                <div class="stat-value" id="criticalAlerts">0</div>
            </div>
            <div class="stat-box">
                <div>Low</div>
                <div class="stat-value" id="lowAlerts">0</div>
            </div>
        </div>

        <h2>📡 Live Alerts</h2>
        <div id="alerts"></div>
    </div>

    <script>
        let ws = null;
        let alertCount = 0;
        let criticalCount = 0;
        let lowCount = 0;

        function connect() {
            const wsUrl = 'ws://localhost:8000/ws/alerts';
            console.log('Connecting to', wsUrl);

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').textContent = '✅ Connected';
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
            };

            ws.onmessage = (event) => {
                try {
                    const alert = JSON.parse(event.data);
                    displayAlert(alert);
                } catch (e) {
                    console.error('Failed to parse alert:', e);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').textContent = '⚠️ Disconnected';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function displayAlert(alert) {
            alertCount++;

            if (alert.severity === 'critical') {
                criticalCount++;
            } else {
                lowCount++;
            }

            // Update stats
            document.getElementById('totalAlerts').textContent = alertCount;
            document.getElementById('criticalAlerts').textContent = criticalCount;
            document.getElementById('lowAlerts').textContent = lowCount;

            // Create alert element
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert alert-' + alert.severity;
            alertDiv.innerHTML = `
                <strong>${alert.attack_type}</strong> - ${alert.severity.toUpperCase()}
                <br>Source: ${alert.source_ip} → Destination: ${alert.dest_ip}
                <br>Confidence: ${(alert.confidence * 100).toFixed(2)}%
                <br>Time: ${new Date(alert.timestamp).toLocaleString()}
            `;

            // Add to top of list
            const alertsContainer = document.getElementById('alerts');
            alertsContainer.insertBefore(alertDiv, alertsContainer.firstChild);
        }

        function clearAlerts() {
            document.getElementById('alerts').innerHTML = '';
            alertCount = 0;
            criticalCount = 0;
            lowCount = 0;
            document.getElementById('totalAlerts').textContent = '0';
            document.getElementById('criticalAlerts').textContent = '0';
            document.getElementById('lowAlerts').textContent = '0';
        }

        // Auto-connect on load
        window.onload = () => {
            connect();
        };
    </script>
</body>
</html>
